[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vla-recovery-pipeline"
version = "0.1.0"
description = "Persistent recovery-skill mining and execution for VLA policies"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = [
    "numpy>=1.24",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
runtime = [
    "opencv-python-headless>=4.8",
    "torch>=2.2",
]
dev = [
    "ruff>=0.2.2",
]

[tool.setuptools.packages.find]
where = ["."]
include = [
    "experiments.robot.libero.skill_pipeline*",
    "experiments.robot.libero.tiptop_repro*",
]
namespaces = true

[tool.ruff]
line-length = 121
target-version = "py310"

[tool.ruff.lint]
select = ["A", "B", "E", "F", "I", "RUF", "W"]
ignore = ["F722"]
