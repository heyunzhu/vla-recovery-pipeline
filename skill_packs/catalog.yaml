status_definitions:
  released: Has online-indexed skills and retained regression coverage.
  validated_candidate: Has successful historical validation evidence but is not promoted online.
  mining: Active campaign pack; artifacts may remain fail_only.
  experiment: Task-specific experimental pack with limited scope.
  scratch: Empty or provisional authoring pack.
  archived: Frozen campaign record. Do not modify; a copy continues as the working pack of a later campaign.

